<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension Settings</title>
    <style>
        * {box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif;}
        body {width: 100%; background: #f4f4f4; padding: 15px;}
        .settings-container { display: flex; flex-direction: column; background: white; padding: 15px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1);}
        .setting { display: flex; align-items: center; margin-top: 10px; }
        .setting label { flex: 1; text-align: left; margin-right: 10px; }
        .setting input { flex: 2; padding: 5px; }
        .checkbox-setting {display: flex; align-items: center; justify-content: flex-start; gap: 8px; margin-top: 8px;}
        .checkbox-setting input {margin: 0;}
        button { margin-top: 15px; padding: 10px; cursor: pointer; }
        #status { margin-top: 10px; color: green; min-height: 20px; visibility: visible; text-align: center;}
        .support-footer {margin-top: 15px; font-size: 12px; color: #777; text-align: center;}
        .support-footer a {color: #007bff; text-decoration: none;}
        .support-footer a:hover {text-decoration: underline;}
    </style>
</head>
<body>
    <div class="settings-container">
        <div class="setting">
            <label for="serverUrl">Server URL:</label>
            <input type="text" id="serverUrl">
        </div>

        <div class="setting">
            <label for="serverToken">API Token:</label>
            <input type="password" id="serverToken">
        </div>

        <div class="setting">
            <label for="daysValue">Expiration Time (days):</label>
            <input type="number" id="daysValue" min="1">
        </div>

        <div class="setting">
            <label for="viewsValue">Max Views:</label>
            <input type="number" id="viewsValue" min="1">
        </div>

        <div class="checkbox-setting">
            <input type="checkbox" id="oneStep">
            <label for="oneStep">One-step link</label>
        </div>
        <div class="checkbox-setting">
            <input type="checkbox" id="userDeletable">
            <label for="userDeletable">Deletable by viewer</label>
        </div>

        <button id="saveOptions">Save</button>
        <p id="status"></p>

    </div>

    <footer class="support-footer">
        <a id="serverLink" href="https://pwpush.clss.pl/" target="_blank">pwpush.clss.pl</a> | <a href="https://www.clss.pl/" target="_blank">//coding.lifestyle Studio</a>
    </footer>

    <script src="options.js"></script>
</body>
</html>
